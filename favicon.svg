<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<style>
		.card { fill: white; stroke: oklch(85% 0 0); stroke-width: 1.5; }
		.back { fill: oklch(93% 0 0); }
		.glyph { fill: none; stroke: oklch(15% 0 0); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
		.eye { fill: white; stroke: oklch(15% 0 0); stroke-width: 1.25; }
		.pupil { fill: oklch(15% 0 0); }
		@media (prefers-color-scheme: dark) {
			.card { fill: oklch(27% 0 0); stroke: oklch(42% 0 0); }
			.back { fill: oklch(34% 0 0); }
			.glyph { stroke: oklch(94% 0 0); }
			/* A dark outline would vanish on a dark tab */
			.eye { stroke: white; }
		}
	</style>
	<!-- Cuts a gap around the eyes out of the stack -->
	<mask id="cut">
		<rect width="32" height="32" fill="white"/>
		<ellipse cx="20.25" cy="6.5" rx="5" ry="6" fill="black"/>
		<ellipse cx="28" cy="6.5" rx="5" ry="6" fill="black"/>
	</mask>
	<g mask="url(#cut)">
		<rect class="card back" x="6" y="1" width="15" height="10" rx="3"/>
		<rect class="card back" x="3.5" y="4" width="20" height="10" rx="3.5"/>
		<rect class="card" x="1" y="7" width="25" height="24" rx="5.5"/>
		<!-- The empty-state tile’s pull-request glyph (style.css, .tile), redrawn on a 16-unit grid with a heavier stroke -->
		<g class="glyph" transform="translate(13.5 19) translate(-8 -8)">
			<circle cx="4" cy="3.5" r="1.75"/>
			<circle cx="4" cy="12.5" r="1.75"/>
			<circle cx="12" cy="12.5" r="1.75"/>
			<path d="M4 5.25v5.5M12 10.75V6.5A2.5 2.5 0 0 0 9.5 4H7.5M9.25 2.25 7.5 4l1.75 1.75"/>
		</g>
	</g>
	<!-- The eyes look at the queue -->
	<ellipse class="eye" cx="20.25" cy="6.5" rx="3.25" ry="4.25"/>
	<ellipse class="eye" cx="28" cy="6.5" rx="3.25" ry="4.25"/>
	<circle class="pupil" cx="19.25" cy="7.5" r="1.3"/>
	<circle class="pupil" cx="27" cy="7.5" r="1.3"/>
</svg>
