<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<style>
		.card { fill: white; stroke: oklch(78% 0 0); stroke-width: 1.5; }
		.back { fill: oklch(90% 0 0); }
		.glyph { fill: none; stroke: oklch(15% 0 0); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
		/* A black outline merges with the pupil into one blot at 16px */
		.eye { fill: white; stroke: oklch(50% 0 0); stroke-width: 1.25; }
		.pupil { fill: oklch(15% 0 0); }
		@media (prefers-color-scheme: dark) {
			.card { fill: oklch(27% 0 0); stroke: oklch(48% 0 0); }
			.back { fill: oklch(38% 0 0); }
			.glyph { stroke: oklch(94% 0 0); }
			/* A dark outline would vanish on a dark tab */
			.eye { stroke: white; }
		}
	</style>
	<!-- Cuts a gap around the eyes out of the stack -->
	<mask id="cut">
		<rect width="32" height="32" fill="white"/>
		<ellipse cx="20.75" cy="6" rx="5.5" ry="6.75" fill="black"/>
		<ellipse cx="27.25" cy="6" rx="5.5" ry="6.75" fill="black"/>
	</mask>
	<g mask="url(#cut)">
		<rect class="card back" x="5.5" y="1" width="18" height="10" rx="3"/>
		<rect class="card back" x="3" y="4.75" width="23" height="10" rx="3.75"/>
		<rect class="card" x="0.75" y="8.75" width="30.5" height="22.5" rx="5.5"/>
		<!-- The empty-state tile’s pull-request glyph (style.css, .tile), redrawn larger and centered on the card -->
		<g class="glyph">
			<circle cx="10" cy="15" r="2.75"/>
			<circle cx="10" cy="25" r="2.75"/>
			<circle cx="22" cy="25" r="2.75"/>
			<path d="M10 17.75v4.5M22 22.25V18.5a3.5 3.5 0 0 0-3.5-3.5H16M18.75 12.25 16 15l2.75 2.75"/>
		</g>
	</g>
	<!-- The eyes look at the queue -->
	<ellipse class="eye" cx="20.75" cy="6" rx="4" ry="5.25"/>
	<ellipse class="eye" cx="27.25" cy="6" rx="4" ry="5.25"/>
	<circle class="pupil" cx="19.5" cy="7.75" r="2.25"/>
	<circle class="pupil" cx="26" cy="7.75" r="2.25"/>
</svg>
